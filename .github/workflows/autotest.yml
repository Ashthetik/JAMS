name: JAMS Autotest

on:
    push:
        branches: [main, beta]
    pull_request:

jobs:
    build-and-test:
        runs-on: ubuntu-24.04
        #timeout-minutes: 60

        steps:
            - uses: actions/checkout@v7
            - name: Install build dependencies
              run: |
                sudo apt update
                sudo apt install -y \
                cmake ninja-build build-essential \
                liburing-dev libssl-dev libsqlite3-dev \
                python3 python3-pip
            
            - name: Install liburing version check
              run: |
                uname -r
            
            - name: Configure & Build (Release) 
              run: |
                cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release
                cmake --build build
            
            - name: Generate throwaway TLS cert
              run: |
                mkdir -p tests/fixtures/tls
                openssl req -x509 -newkey rsa:4096 -nodes \
                -keyout tests/fixtures/tls/key.pem \
                -out tests/fixtures/tls/cert.pem \
                -days 1 -subj "/CN=localhost"
            
            - name: Setup test config
              run: |
                mkdir -p /tmp/jams/{db,mail,tls,config,logs}
                sudo mkdir -p /etc/jams/tls
                sudo cp tests/fixtures/tls/cert.pem /etc/jams/tls/
                sudo cp tests/fixtures/tls/key.pem /etc/jams/tls/
                envsubst < tests/fixtures/server.toml.ci > /tmp/jams/config/server.toml

            - name: Install test dependencies
              run: pip install -r tests/integration/requirements.txt

            - name: Debug test discovery
              env:
                  JAMS_BIN: ${{github.workspace}}/build/mailserver
                  JAMS_CONFIG: /tmp/jams/config/server.toml
                  JAMS_LOG_PATH: /tmp/jams/logs/jams.txt
                  JAMS_PEPPER: ci-test-pepper-not-a-secret
              run: |
                echo "--- contents of tests/integration ---"
                find tests/integration -type f 2>&1 || echo "directory does not exist"
                echo "--- pytest collect-only ---"
                python3 -m pytest tests/integration --collect-only -q

            - name: Run integration & Security Test
              env:
                  JAMS_BIN: ${{github.workspace}}/build/mailserver
                  JAMS_CONFIG: /tmp/jams/config/server.toml
                  JAMS_LOG_PATH: /tmp/jams/logs/jams.txt
                  JAMS_PEPPER: ci-test-pepper-not-a-secret
              run: python3 -m pytest tests/integration -v --tb=short
            
            - name: Upload server logs on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                name: jams-test-logs
                path: /tmp/jams/logs/*.txt
